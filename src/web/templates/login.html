{% extends "basis.html" %}
{% block titel %}Anmeldung{% endblock %}
{% block inhalt %}
<div class="anmeldung">
  <div class="karte">
    <h1>Anmeldung</h1>
    <form method="post" action="/app/login">
      <label class="feld">E-Mail
        <input type="email" name="email" required autofocus
               value="{{ email or '' }}" autocomplete="username">
      </label>
      <label class="feld" style="margin-top:0.6rem">Passwort
        <input type="password" name="passwort" required autocomplete="current-password">
      </label>
      <input type="hidden" name="weiter" value="{{ weiter or '/app' }}">
      <div class="aktionen"><button type="submit">Anmelden</button></div>
    </form>
    <p class="fussnote">Entwicklungszugang: admin@musterschutz.example / musterschutz!</p>
  </div>
</div>
{% endblock %}
